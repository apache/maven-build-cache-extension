name: Verify 4.0

# Maven 4 is not verified on every push: let's focus on Resolver 2 first. Start this workflow by
# hand from the Actions tab when a Maven 4 run is wanted. Commenting the trigger out instead makes
# the file invalid, which GitHub reports as a failed run on every push and pull request.
on:
  workflow_dispatch:

jobs:
  build:
    name: Verify
    uses: apache/maven-gh-actions-shared/.github/workflows/maven-verify.yml@v5
    with:
      maven4-enabled: false
      matrix-exclude: '[ {"jdk": "8"} ]'
      ff-goal: '-P run-its,maven4.0 verify javadoc:jar'
      verify-goal: '-P run-its,maven4.0 verify javadoc:jar'

