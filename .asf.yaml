# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Build Cache Extension"
  homepage: https://maven.apache.org/extensions/maven-build-cache-extension/
  labels:
    - java
    - build-management
    - apache-maven
    - maven
  protected_branches:
    master: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  features:
    issues: true

notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org

# https://releases.apache.org/projects/maven-build-cache-extension
project:
  metadata:
    key: maven-build-cache-extension
    committee: maven
    name: Apache Maven Build Cache Extension
    description: Maven Incremental Build and Cache (local and remote).
    homepage: https://maven.apache.org/extensions/maven-build-cache-extension/
    download_page: https://maven.apache.org/extensions/maven-build-cache-extension/download.cgi
    bug_database: https://maven.apache.org/extensions/maven-build-cache-extension/issue-management.html
    mailing_lists: https://maven.apache.org/extensions/maven-build-cache-extension/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-build-cache-extension
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-build-cache-extension
    download_path_suffix: buildcache
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
